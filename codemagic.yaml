workflows:
  android-build:
    name: Android APK Build (macOS)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Nettoyage radical et suppression de tout l historique natif
        script: |
          rm -rf android ios build .dart_tool .metadata
          flutter pub cache clean --force || true
      - name: Regénération propre de l architecture Android avec package personnalisé
        script: |
          flutter create . --platforms=android --project-name=app --org=com.bxremote
      - name: Autorisation automatique du trafic HTTP local
        script: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i '' 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          fi
      - name: Restauration des dépendances du projet
        script: |
          flutter pub get
      - name: Application de l icone personnalisée
        script: |
          dart run flutter_launcher_icons || true
      - name: Compilation de l APK Release final
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
