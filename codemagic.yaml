workflows:
  android-build:
    name: Android APK Build (macOS)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Generer le dossier Android
        script: |
          flutter create . --platforms=android --force
      - name: Recuperer les dependances Pub
        script: |
          flutter pub get
      - name: Generer l icone de l application
        script: |
          dart run flutter_launcher_icons || true
      - name: Compiler l APK Android (Release)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
