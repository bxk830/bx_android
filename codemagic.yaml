workflows:
  android-build:
    name: Android APK Build (macOS)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Purge totale des caches et des fichiers de configuration obsolètes
        script: |
          rm -rf android ios build .dart_tool .metadata
          flutter clean
      - name: Recréation propre du projet Android (Architecture V2 moderne)
        script: |
          flutter create . --platforms=android --project-name=bxremote
      - name: Autorisation du trafic HTTP local (Cleartext Traffic)
        script: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i '' 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          fi
      - name: Récupération des dépendances Flutter
        script: |
          flutter pub get
      - name: Génération de l icône de l application
        script: |
          dart run flutter_launcher_icons || true
      - name: Compilation finale de l APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
