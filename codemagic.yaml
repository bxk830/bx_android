workflows:
  android-build:
    name: Android APK Build (macOS)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Nettoyer l ancien projet Android et vider le cache
        script: |
          rm -rf android
          flutter clean
      - name: Generer le dossier Android propre (Embedding V2)
        script: |
          flutter create . --platforms=android --force
      - name: Autoriser le trafic HTTP local (Cleartext Traffic)
        script: |
          sed -i '' 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
      - name: Recuperer les dependances Pub
        script: |
          flutter pub get
      - name: Generer l icone de l application
        script: |
          dart run flutter_launcher_icons || true
      - name: Compiler l APK Android (Release)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
